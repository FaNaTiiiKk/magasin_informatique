<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commander un produit</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Passer une commande</h1>

    <form method="POST">
        <label for="id_produit">Choisir un produit :</label>
        <select name="id_produit" id="id_produit" required>
            <option value="">-- Sélectionnez un produit --</option>
            {% for produit in produits %}
                <option value="{{ produit['id'] }}">
                    {{ produit['nom'] }} - {{ produit['prix'] }} € (Stock : {{ produit['stock'] }})
                </option>
            {% endfor %}
        </select>

        <br><br>

        <label for="quantite">Quantité :</label>
        <input type="number" name="quantite" id="quantite" min="1" value="1" required>

        <br><br>

        <button type="submit">Commander</button>
    </form>

    <br>

    <a href="/client/{{ id_client }}">Retour espace client</a>

</body>
</html>
