<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="center-form">

    <div class="login-box">

        <h2>Inscription</h2>

        <form action="/inscription" method="POST">
            <input type="text" name="nom" placeholder="Nom" required><br>
            <input type="text" name="prenom" placeholder="Prénom" required><br>
            <input type="email" name="email" placeholder="Email" required><br>
            <input type="password" name="password" placeholder="Mot de passe" required><br>
            <input type="tel" name="telephone" placeholder="Téléphone" required><br>
            <input type="text" name="adresse" placeholder="Lieu d'habitation" required><br>
            
            <button type="submit">S'inscrire</button>
        </form>

        <p style="margin-top: 15px; font-family: Arial, sans-serif; font-size: 14px; text-align: center; color: #333;">
            Déjà inscrit ? <a href="/login" style="background: none; color: #6a11cb; padding: 0; margin: 0; display: inline; text-decoration: underline;">Se connecter</a>
        </p>

    </div>

</div>

</body>
</html>
