<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<h1>Espace Client</h1>

{% if client %}
    <h2>Bonjour {{ client.prenom }} {{ client.nom }}</h2>
{% endif %}
<a href="/">Se déconnecter</a>

<br><br>
<a href="/client/{{ id_client }}/commander" style="display: inline-block; padding: 10px 15px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
    🛒 Passer une commande
</a>
<br>

<h3>Mes produits achetés</h3>

<table border="1">
    <tr>
        <th>Produit</th>
        <th>Prix</th>
        <th>Quantité</th>
    </tr>

    {% for p in produits %}
    <tr>
        <td>{{ p.nom }}</td>
        <td>{{ p.prix }}</td>
        <td>{{ p.quantite }}</td>
    </tr>
    {% endfor %}
</table>
